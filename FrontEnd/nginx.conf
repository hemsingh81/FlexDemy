server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite SPA: unknown paths fall back to index.html so client-side state
    # (activeTab, etc.) resolves rather than 404ing on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
