  - epic: 6
    action: "Story 6.5 found and fixed a real, pre-existing bug in SettingRepository.ApplyValueAsync (unaliased raw-SQL column name broke EF Core's SqlQuery<T> against real Postgres -- '42703: column s.Value does not exist') dating back to Story 6.1/6.2, invisible to every existing test because EF InMemory can't execute raw SqlQuery<T> at all. Only caught via a manual live-Docker verification step, not CI. Worth a deliberate sweep of this codebase's other raw-SQL call sites (AiTaskBudgetRepository.cs and any others) for the same unaliased-column risk, and reinforces the standing case for real Postgres-backed integration tests, not just unit tests against InMemory."
    owner: "Dev"
    status: open
  - epic: 7
    action: "Epics 7-11's work (all 15 ContentAuthoring stories, now done) is still entirely uncommitted on top of Epic 4/5/6's own already-flagged uncommitted baseline -- the same standing recommendation as those epics' items, now covering the whole ContentAuthoring initiative on one shared working tree. This absence of per-story commits is also *why* this code review had to run as one combined pass across all 15 stories rather than story-by-story (see deferred-work.md's '7-1 through 11-4' entry) -- committing per-story going forward would make each subsequent review a plain git diff again."
    owner: "Dev"
    status: open
  - epic: 7
    action: "During this review, the working tree was found fully re-staged (git add, not committed) twice in one session with no explicit request for it, and a repo-root 'Backend' vs git-tracked 'BackEnd' directory-casing mismatch silently made every backend git pathspec match zero files in an earlier verification pass (Windows filesystem is case-insensitive, git's pathspec matching is not, even with core.ignorecase=true) -- both times caught and safely undone (plain 'git reset', HEAD confirmed unchanged throughout), but the *cause* of the repeated auto-staging was never identified (checked .claude/settings.json's hooks and .bmad-loop/ scripts -- neither does it). Worth the user checking their local tooling (IDE git integration auto-stage setting, a global git hook, etc.) for what's re-staging the tree, and always using the 'BackEnd' casing (not 'Backend') in any git pathspec against this repo."
    owner: "Dev"
    status: open
